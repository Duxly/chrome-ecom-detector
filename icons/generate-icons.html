<!DOCTYPE html>
<html>
<head>
  <title>Generate Extension Icons</title>
</head>
<body>
  <canvas id="canvas16" width="16" height="16"></canvas>
  <canvas id="canvas48" width="48" height="48"></canvas>
  <canvas id="canvas128" width="128" height="128"></canvas>
  
  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const scale = size / 128;
      
      // Background
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, size, size);
      
      // Shopping cart (accent color)
      ctx.strokeStyle = '#e94560';
      ctx.fillStyle = '#e94560';
      ctx.lineWidth = 3 * scale;
      
      // Cart body
      ctx.beginPath();
      ctx.moveTo(30 * scale, 40 * scale);
      ctx.lineTo(35 * scale, 70 * scale);
      ctx.lineTo(85 * scale, 70 * scale);
      ctx.lineTo(90 * scale, 40 * scale);
      ctx.closePath();
      ctx.stroke();
      
      // Cart wheels
      ctx.beginPath();
      ctx.arc(45 * scale, 80 * scale, 4 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(75 * scale, 80 * scale, 4 * scale, 0, Math.PI * 2);
      ctx.fill();
      
      // Magnifying glass (white)
      ctx.strokeStyle = '#ffffff';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 3 * scale;
      
      // Glass circle
      ctx.beginPath();
      ctx.arc(85 * scale, 50 * scale, 18 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      
      // Handle
      ctx.beginPath();
      ctx.moveTo(98 * scale, 63 * scale);
      ctx.lineTo(110 * scale, 75 * scale);
      ctx.stroke();
    }
    
    drawIcon(document.getElementById('canvas16'), 16);
    drawIcon(document.getElementById('canvas48'), 48);
    drawIcon(document.getElementById('canvas128'), 128);
    
    // Download helper
    function downloadCanvas(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    
    console.log('Icons generated. Use browser console to download:');
    console.log('downloadCanvas("canvas16", "icon16.png")');
    console.log('downloadCanvas("canvas48", "icon48.png")');
    console.log('downloadCanvas("canvas128", "icon128.png")');
  </script>
</body>
</html>
